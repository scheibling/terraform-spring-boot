# JitPack build: https://jitpack.io/#scheibling/terraform-spring-boot
# Sets every module's version to the requested JitPack version (tag, commit or <branch>-SNAPSHOT)
# and skips signing, which needs the release GPG key.
jdk:
  - openjdk21
install:
  - mvn -B versions:set-property -Dproperty=revision -DnewVersion=$VERSION -DgenerateBackupPoms=false
  - mvn -B install -DskipTests -Dgpg.skip -pl terraform-client,terraform-spring-boot-autoconfigure,terraform-spring-boot-starter
